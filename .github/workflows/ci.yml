name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, model-free checks: formatting, linting, syntax and unit tests.
  # The real upscale smoke test (pnpm run test:manual) is deliberately not run here.
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install tooling
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Shellcheck
        run: pnpm run lint:shell

  check:
    needs: lint-test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          ./build-app.sh
          ./build-app.sh --release
          codesign --verify --strict 'build/Mugi Dev.app'
          codesign --verify --strict 'build/Mugi.app'
