name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check and build
        run: |
          sh -n build-app.sh
          sh -n setup.sh
          bash -n packaging/build-dmg.sh
          python3 -m py_compile upscale.py
          ./build-app.sh
          codesign --verify --strict 'build/4K Upscaler.app'
