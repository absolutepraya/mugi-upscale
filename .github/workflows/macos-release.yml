name: macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor.patch)
        required: true
        type: string

concurrency:
  group: macos-release

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists. Delete it and its tag first, or pick a new version." >&2
            exit 1
          fi
      - name: Build the DMG
        run: ./packaging/build-dmg.sh "$VERSION"
      - name: Create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="build/dist/mugi-$VERSION-arm64.dmg"
          (
            cd build/dist
            shasum -a 256 "mugi-$VERSION-arm64.dmg" > "mugi-$VERSION-arm64.dmg.sha256"
          )
          gh release create "v$VERSION" "$dmg" "$dmg.sha256" \
            --target "$GITHUB_SHA" --title "Mugi $VERSION" --notes-file packaging/INSTALL.md --generate-notes
